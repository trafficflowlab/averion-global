name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: sudo apt-get install -y sshpass lftp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -v '^\.github')
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload via sftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No files to upload."
            exit 0
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue
            DIR=$(dirname "$FILE")
            echo "--- Uploading: $FILE ---"

            # Build sftp batch
            BATCH=$(mktemp)
            if [ "$DIR" != "." ]; then
              echo "-mkdir public_html/$DIR" >> "$BATCH"
            fi
            echo "put $FILE public_html/$FILE" >> "$BATCH"
            echo "bye" >> "$BATCH"

            cat "$BATCH"

            sshpass -p "$FTP_PASS" sftp \
              -P 65002 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=no \
              -b "$BATCH" \
              "$FTP_USER@$FTP_HOST"

            STATUS=$?
            rm "$BATCH"

            if [ $STATUS -ne 0 ]; then
              echo "ERROR: Failed to upload $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done <<< "$FILES"

          echo "All files deployed."
