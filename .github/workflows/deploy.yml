name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: sudo apt-get install -y sshpass lftp

      - name: Diagnose server structure
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== Listing SFTP root ==="
          BATCH=$(mktemp)
          echo "ls" >> "$BATCH"
          echo "ls public_html" >> "$BATCH"
          echo "ls public_html/thank-you" >> "$BATCH"
          echo "bye" >> "$BATCH"
          sshpass -p "$FTP_PASS" sftp -P 65002 -o StrictHostKeyChecking=no -b "$BATCH" "$FTP_USER@$FTP_HOST" 2>&1 || true
          rm "$BATCH"

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -v '^\.github')
          echo "Changed files: $FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload via sftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No files to upload."
            exit 0
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue
            DIR=$(dirname "$FILE")
            echo "--- Uploading: $FILE ($(wc -c < $FILE) bytes) ---"

            BATCH=$(mktemp)
            if [ "$DIR" != "." ]; then
              echo "-mkdir public_html/$DIR" >> "$BATCH"
            fi
            echo "put $FILE public_html/$FILE" >> "$BATCH"
            echo "get public_html/$FILE /tmp/verify_$(basename $FILE)" >> "$BATCH"
            echo "bye" >> "$BATCH"

            sshpass -p "$FTP_PASS" sftp \
              -P 65002 \
              -o StrictHostKeyChecking=no \
              -b "$BATCH" \
              "$FTP_USER@$FTP_HOST" 2>&1
            rm "$BATCH"

            echo "=== Server file first 5 lines ==="
            head -5 /tmp/verify_$(basename $FILE) 2>/dev/null || echo "Could not retrieve file"
            echo "=== Server file size: $(wc -c < /tmp/verify_$(basename $FILE) 2>/dev/null || echo unknown) bytes ==="
          done <<< "$FILES"
