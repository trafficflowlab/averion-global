name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP (lftp)
        run: |
          sudo apt-get install -y lftp
          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://${{ secrets.FTP_HOST }}:65002;
          mirror -R --no-empty-dirs --parallel=4 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            ./ public_html/;
          quit"
