name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -v '^\.github')
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changed files via SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No files to upload."
            exit 0
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue
            DIR=$(dirname "$FILE")

            echo "--- Uploading: $FILE ---"

            MKDIR_CMD=""
            if [ "$DIR" != "." ]; then
              MKDIR_CMD="mkdir -p public_html/$DIR;"
            fi

            lftp -c "
            set sftp:auto-confirm yes;
            set xfer:log true;
            set net:max-retries 2;
            open -u $FTP_USER,$FTP_PASS sftp://$FTP_HOST:65002;
            $MKDIR_CMD
            put $FILE -o public_html/$FILE;
            quit"

            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              echo "ERROR: Failed to upload $FILE (exit $STATUS)"
              exit 1
            fi
            echo "OK: $FILE uploaded."
          done <<< "$FILES"

          echo "All files deployed successfully."
