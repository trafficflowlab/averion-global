name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -T 10 ${{ secrets.FTP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -v '^\.github')
          echo "Changed files: $FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload via SFTP (SSH key)
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No files to upload."
            exit 0
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue
            DIR=$(dirname "$FILE")
            echo "--- Uploading: $FILE ---"

            BATCH=$(mktemp)
            if [ "$DIR" != "." ]; then
              echo "-mkdir public_html/$DIR" >> "$BATCH"
            fi
            echo "put $FILE public_html/$FILE" >> "$BATCH"
            echo "bye" >> "$BATCH"

            sftp -P 65002 \
              -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -b "$BATCH" \
              ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }}

            STATUS=$?
            rm "$BATCH"
            [ $STATUS -ne 0 ] && echo "ERROR: Failed $FILE" && exit 1

            # Verify via SSH: check actual file size on server
            REMOTE_SIZE=$(ssh -p 65002 -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }} \
              "wc -c < ~/public_html/$FILE 2>/dev/null || echo 0")
            LOCAL_SIZE=$(wc -c < "$FILE")
            echo "Local: $LOCAL_SIZE bytes | Server: $REMOTE_SIZE bytes"
            [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ] && echo "MISMATCH — file not updated!" && exit 1
            echo "OK: $FILE"
          done <<< "$FILES"

          echo "All files deployed."
